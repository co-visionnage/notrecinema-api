include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

stages:
  - quality
  - test
  - security
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'

.go-job:
  image: golang:1.26-alpine
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go-cache
  variables:
    GOPATH: '$CI_PROJECT_DIR/.go-cache'
  before_script:
    - apk add --no-cache git

# Схема БД -- не часть этого репозитория (см. ../notrecinema-schema и
# docs/ROADMAP.md, пункт 2), поэтому интеграционным тестам нужно склонировать
# её отдельно. SCHEMA_REPO_URL задайте в CI/CD-переменных проекта, когда
# появится реальный GitLab-репозиторий notrecinema-schema; до тех пор job
# использует дефолт ниже как документацию ожидаемого адреса.
.postgres-nats-services:
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: nats:2.10-alpine
      alias: nats
      command: ['-js']
  variables:
    POSTGRES_DB: notrecinema_ci
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ci-postgres-password
    APP_DB_PASSWORD: ci-app-password
    MIGRATE_DATABASE_URL: postgresql://postgres:ci-postgres-password@postgres:5432/notrecinema_ci
    DATABASE_URL: postgresql://app_user:ci-app-password@postgres:5432/notrecinema_ci
    NATS_URL: nats://nats:4222
    SCHEMA_REPO_URL: https://gitlab.com/notrecinema/database.git

.main-only:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

vet:
  extends: .go-job
  stage: quality
  script:
    - go vet ./...

lint:
  stage: quality
  image: golangci/golangci-lint:v2.11-alpine
  script:
    - golangci-lint run --timeout 5m ./...

unit-tests:
  extends: .go-job
  stage: test
  script:
    - go test ./... -v > unit-test-output.log 2>&1; TEST_EXIT=$?
    - cat unit-test-output.log
    - go run github.com/jstemmer/go-junit-report/v2@latest -in unit-test-output.log -out junit-unit.xml
    - exit $TEST_EXIT
  artifacts:
    when: always
    reports:
      junit: junit-unit.xml
    expire_in: 1 week

integration-tests:
  extends:
    - .go-job
    - .postgres-nats-services
  stage: test
  before_script:
    - apk add --no-cache git nodejs npm
    - git clone --depth 1 "$SCHEMA_REPO_URL" /tmp/notrecinema-schema
    - cd /tmp/notrecinema-schema && npm install && npm run migrate && cd "$CI_PROJECT_DIR"
  script:
    - go test -tags integration ./... -v

trivy-filesystem-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: ['']
  script:
    - trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0 --format table .
  allow_failure: true

build-image:
  extends: .main-only
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: ['']
  before_script:
    - mkdir -p /kaniko/.docker
    - >-
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}"
      > /kaniko/.docker/config.json
  script:
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}:latest"
      --cache=true
      --cache-repo "${CI_REGISTRY_IMAGE}/cache"

container-scan:
  extends: .main-only
  stage: build
  image:
    name: aquasec/trivy:latest
    entrypoint: ['']
  needs:
    - build-image
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --format table "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  allow_failure: true

deploy-production:
  extends: .main-only
  stage: deploy
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
  script:
    - >-
      ssh "$SSH_USER@$SSH_HOST"
      "cd $DEPLOY_PATH &&
       git fetch origin &&
       git checkout $CI_COMMIT_SHA &&
       export IMAGE_TAG=$CI_COMMIT_SHORT_SHA &&
       docker compose pull api worker &&
       docker compose up -d --remove-orphans api worker &&
       docker image prune -f"
