name: CI

on:
  push:
  pull_request:

env:
  # Схема БД -- отдельный репозиторий (co-visionnage/database), интеграционным
  # тестам нужно склонировать её отдельно.
  SCHEMA_REPO_URL: https://github.com/co-visionnage/database.git
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11
          args: --timeout 5m ./...

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: Run tests
        run: |
          go test ./... -v > unit-test-output.log 2>&1 || TEST_EXIT=$?
          cat unit-test-output.log
          go run github.com/jstemmer/go-junit-report/v2@latest -in unit-test-output.log -out junit-unit.xml
          exit ${TEST_EXIT:-0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit
          path: junit-unit.xml
          retention-days: 7

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notrecinema_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        options: >-
          --entrypoint "nats-server"
    env:
      POSTGRES_DB: notrecinema_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-postgres-password
      APP_DB_PASSWORD: ci-app-password
      MIGRATE_DATABASE_URL: postgresql://postgres:ci-postgres-password@localhost:5432/notrecinema_ci
      DATABASE_URL: postgresql://app_user:ci-app-password@localhost:5432/notrecinema_ci
      NATS_URL: nats://localhost:4222
      PGHOST: localhost
      PGPASSWORD: ci-postgres-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Clone and apply schema
        run: |
          git clone --depth 1 "$SCHEMA_REPO_URL" /tmp/notrecinema-schema
          sudo apt-get update && sudo apt-get install -y postgresql-client
          cd /tmp/notrecinema-schema
          sh init.sh
          npm install
          npm run migrate
      - run: go test -tags integration ./... -v

  trivy-filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:0.58.0             fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0 --format table .

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build-image:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [vet, lint, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-scan:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Trivy image scan
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-image.outputs.image-tag }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy:0.58.0             image --severity HIGH,CRITICAL --exit-code 0 --format table "$IMAGE_REF"

  deploy-production:
    needs: build-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: ${{ needs.build-image.outputs.image-tag }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          ssh "$SSH_USER@$SSH_HOST" \
            "cd $DEPLOY_PATH && \
             git fetch origin && \
             git checkout $GITHUB_SHA && \
             git -C ../notrecinema-schema pull --ff-only && \
             export API_IMAGE_TAG=$IMAGE_TAG && \
             docker compose -f docker-compose.prod.yml build migrate && \
             docker compose -f docker-compose.prod.yml pull api && \
             docker compose -f docker-compose.prod.yml up -d --remove-orphans api && \
             docker image prune -f"
